[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "erpbrasil.transmissao"
version = "1.2.0"
description = "Transporte SOAP (zeep) com certificado digital para os webservices fiscais brasileiros"
readme = "README.rst"
license = {text = "MIT"}
authors = [
  {name = "Luis Felipe Mileo", email = "mileo@kmee.com.br"},
]
keywords = ["SOAP", "zeep", "NF-e", "SEFAZ", "certificado digital", "webservice"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Utilities",
]
# Piso 3.6: e o Python do CI da OCA para o Odoo 12.0. Odoo 20 roda ate 3.14.
requires-python = ">=3.6"
dependencies = [
    "erpbrasil.assinatura>=1.8.1",
    # zeep 4.3.3 exige Python 3.10; nos Pythons antigos o resolvedor pega a 4.x anterior.
    "zeep>=4.0,<5",
    "requests",
    "lxml",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "coverage[toml]",
    "vcrpy",
]
doc = [
    "sphinx>=1.3",
    "sphinx-rtd-theme",
]

[project.scripts]
erpbrasil-transmissao = "erpbrasil.transmissao.cli:main"

[project.urls]
Homepage = "https://github.com/erpbrasil/erpbrasil.transmissao"
Documentation = "https://erpbrasiltransmissao.readthedocs.io/en/latest/"
Changelog = "https://github.com/erpbrasil/erpbrasil.transmissao/blob/master/CHANGELOG.rst"
"Issue Tracker" = "https://github.com/erpbrasil/erpbrasil.transmissao/issues"

# O namespace `erpbrasil` e compartilhado com erpbrasil.base, erpbrasil.assinatura e
# erpbrasil.edoc. O wheel leva src/erpbrasil/__init__.py com pkgutil.extend_path, igual
# ao da erpbrasil.base.
[tool.hatch.build.targets.wheel]
packages = ["src/erpbrasil"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "docs",
    "AUTHORS.rst",
    "CHANGELOG.rst",
    "CONTRIBUTING.rst",
    "LICENSE",
    "README.rst",
    "tox.ini",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --tb=short"

[tool.coverage.run]
branch = true
source = ["erpbrasil.transmissao"]

[tool.coverage.paths]
source = ["src", "*/site-packages"]

[tool.coverage.report]
show_missing = true
precision = 2

[tool.ruff]
# O menor alvo que o ruff aceita; a sintaxe fica compativel com 3.6 e o CI roda em 3.6 e 3.7.
target-version = "py37"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["erpbrasil"]
